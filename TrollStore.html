:root[data-theme="light"]{--bg:#fff;--gbg:#f2f2f7;--card:#fff;--tx:#000;--mu:rgba(60,60,67,.6);--ln:rgba(60,60,67,.22);--ac:#0088ff;--fld:rgba(118,118,128,.12);--glass:rgba(255,255,255,.72);--spec:rgba(255,255,255,.9);--edge:rgba(0,0,0,.06);--lensbg:rgba(120,120,128,.16);--sheet:rgba(248,248,250,.92);--press:rgba(0,0,0,.06);--sw:rgba(120,120,128,.16);--gr:#34c759;--sh:rgba(0,0,0,.12)}
html[data-v=settings]{--cur:var(--gbg)}
html{height:100%;background:var(--cur);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
body{margin:0;min-height:100%;background:var(--cur);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:17px;line-height:1.29;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--cur);z-index:7}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes iconin{from{transform:scale(.9);filter:blur(4px)}to{transform:none;filter:blur(0)}}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;letter-spacing:-.4px;background:var(--cur);background:color-mix(in srgb,var(--cur) 82%,transparent);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:.5px solid transparent;transition:border-color .2s,box-shadow .3s}
.scrolled .nav{border-bottom-color:var(--ln);box-shadow:0 6px 20px -12px var(--sh)}
#plus{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:var(--ac);background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 2px 8px var(--sh),inset 0 .5px 0 var(--spec),inset 0 0 0 .5px var(--edge);cursor:pointer;transition:transform .35s var(--sp2)}
#plus:active{transform:translateY(-50%) scale(.9)}
.sb{display:flex;align-items:center;margin:0 16px 14px}
.search{transition:background-color .3s,box-shadow .3s;flex:1;min-width:0;height:34px;border-radius:17px;background:var(--fld);display:flex;align-items:center;padding:0 12px;color:var(--mu)}
.search .mi{flex:none;background-color:var(--mu);margin-right:8px}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;-webkit-appearance:none;appearance:none;padding:0;margin:0;border-radius:0;color:var(--tx);font-family:inherit;font-size:17px;letter-spacing:-.3px}
.search input::placeholder{color:var(--mu);opacity:1}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.cancel{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;margin-left:0;padding:0;border:0;background:none;color:var(--ac);font-family:inherit;font-size:17px;letter-spacing:-.4px;cursor:pointer;pointer-events:none;transition:max-width .4s var(--sp),opacity .2s,margin .4s var(--sp)}
.sb.f .search{background:color-mix(in srgb,var(--fld) 70%,var(--tx) 5%)}
.search .mi{transition:transform .4s var(--sp)}.sb.f .search .mi{transform:scale(1.1)}
.sb.f .cancel{max-width:90px;opacity:1;margin-left:12px;pointer-events:auto}
.list{border-top:.5px solid var(--ln)}
.row{display:flex;align-items:center;gap:15px;padding:0 16px 0 8px;height:76px;border-bottom:.5px solid var(--ln);cursor:pointer;user-select:none;-webkit-user-select:none;transition:background-color .15s,transform .3s var(--sp)}
.row:active{background-color:var(--press);transform:scale(.985)}
.row.in{animation:rise .6s var(--sp) backwards;animation-delay:calc(var(--i,0)*55ms)}
.row.in .icon{animation:iconin .65s var(--sp) backwards;animation-delay:calc(var(--i,0)*55ms + 70ms)}
.row.gone{animation:gone .38s ease forwards;overflow:hidden;pointer-events:none}
@keyframes gone{to{opacity:0;transform:translateX(-30px);filter:blur(4px);height:0;border-bottom-width:0}}
.icon{width:60px;height:60px;border-radius:13.4px;flex:none;object-fit:cover;display:block;outline:.5px solid rgba(128,128,128,.28);outline-offset:-.5px}
.txt{min-width:0}
.name{font-size:17px;line-height:20px;letter-spacing:-.4px}
.sub{font-size:13px;line-height:16px;color:var(--mu);margin-top:2px;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:60px 16px;text-align:center;color:var(--mu)}
.mi{display:block;background-color:currentColor}

.tabs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px)*.5 + 10px);padding:0 28px;pointer-events:none;z-index:10}
.tabs>div{position:relative;pointer-events:auto;touch-action:pan-y;max-width:400px;margin:0 auto;display:flex;gap:2px;height:64px;padding:5px;border-radius:32px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 8px 26px var(--sh),inset 0 .5px 0 var(--spec),inset 0 0 0 .5px var(--edge)}
.lens{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 6px);border-radius:27px;background:var(--lensbg);box-shadow:inset 0 .5px 0 var(--spec),0 1px 4px rgba(0,0,0,.1);transition:transform .45s cubic-bezier(.32,.72,0,1),width .35s cubic-bezier(.32,.72,0,1),scale .35s cubic-bezier(.3,.9,.3,1),box-shadow .3s;will-change:transform,scale;pointer-events:none}
.tabs>div.press .lens{scale:1.14 1.12;box-shadow:inset 0 .5px 0 var(--spec),0 4px 14px rgba(0,0,0,.16)}
.tab{position:relative;z-index:1;flex:1;border:0;border-radius:27px;background:transparent;color:var(--mu);font-family:inherit;font-size:10px;line-height:12px;font-weight:500;letter-spacing:.1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:color .2s}
.tab[aria-selected=true]{color:var(--ac)}
.tab[aria-selected=true] .mi{animation:pop .5s var(--sp2)}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.hd{margin:26px 36px 7px;color:var(--mu);font-size:13px;line-height:1.3;letter-spacing:-.1px}
.ft{margin:7px 36px 6px;color:var(--mu);font-size:13px;line-height:1.35;letter-spacing:-.1px}
.grp{margin:0 20px;background:var(--card);border-radius:26px;overflow:hidden}
.view.on>.hd,.view.on>.grp,.view.on>.ft{animation:rise .55s var(--sp) backwards;animation-delay:calc(var(--i,0)*45ms)}
.grp .it{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:11px 20px;width:100%;border:0;border-radius:0;background-color:transparent;color:var(--tx);font-family:inherit;font-size:17px;letter-spacing:-.4px;text-align:left;cursor:pointer;transition:background-color .15s}
.grp>.it:not(:last-child){background-image:linear-gradient(var(--ln),var(--ln));background-size:calc(100% - 20px) .5px;background-position:right bottom;background-repeat:no-repeat}
.grp .it:active{background-color:var(--press)}
.val{display:flex;align-items:center;gap:6px;color:var(--mu)}
.sw{width:63px;height:28px;border-radius:14px;background:var(--sw);position:relative;border:0;flex:none;padding:0;cursor:pointer;transition:background-color .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--sp),width .2s}
.sw[aria-checked=true]{background:var(--gr)}.sw[aria-checked=true]::after{transform:translateX(21px)}
.sw:active::after{width:44px}.sw[aria-checked=true]:active::after{transform:translateX(15px)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.2);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px)*.5);transform:translateY(115%);visibility:hidden;transition:transform .4s var(--sp),visibility 0s .4s;z-index:21}
#sheet.on{transform:none;visibility:visible;transition:transform .4s var(--sp)}
.sg{background:var(--sheet);border-radius:28px;overflow:hidden;margin-bottom:10px;backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:0 8px 30px var(--sh),inset 0 0 0 .5px var(--edge)}
.sg .st{padding:16px 20px 12px;text-align:center;font-size:13px;font-weight:600;color:var(--mu);white-space:pre-line}
.sg button{display:block;width:100%;padding:18px;background:none;border:0;border-top:.5px solid var(--ln);color:var(--ac);font-family:inherit;font-size:20px;letter-spacing:-.4px;cursor:pointer}
.sg .st+button,.sg button:first-child{border-top:0}.sg button:active{background-color:var(--press)}

#sheet.on .sg button,#sheet.on .sg .st{animation:rise .5s var(--sp) backwards}
.sg button.d{color:#ff453a}.sg button.c{font-weight:600}
#alert{position:fixed;left:50%;top:50%;width:280px;transform:translate(-50%,-50%) scale(1.06);background:var(--sheet);border-radius:28px;text-align:center;padding:22px 20px 20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s var(--sp);z-index:30;backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:0 12px 40px var(--sh),inset 0 0 0 .5px var(--edge);color:var(--tx)}
#alert.on{opacity:1;transform:translate(-50%,-50%)}
#alert.on b,#alert.on p{animation:rise .5s var(--sp) backwards}#alert.on p{animation-delay:60ms}
#alert b{display:block;font-size:17px;font-weight:600;letter-spacing:-.4px}
#alert p{margin:4px 0 0;font-size:13px;color:var(--mu);white-space:pre-line}#alert p:empty{display:none}
.bar{height:4px;background:var(--fld);border-radius:2px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px;transition:width .15s}

const GEN='<svg class="icon" viewBox="0 0 58 58"><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8472b"/><stop offset="1" stop-color="#f3a86b"/></linearGradient></defs><rect width="58" height="58" fill="url(#g3)"/><circle cx="29" cy="29" r="14" fill="#fff"/></svg>';
let apps=[{n:'Dopamine +',v:'2.2.2',b:'com.SolarTechFrTzxh.dopamine+',i:'dop'},{n:'Trolliee Helper',v:'2.0.12',b:'com.trollieee.helper',i:'troll'},{n:'Dropi',v:'1.0',b:'com.demo.dropi',i:'drp'}];
const $=s=>document.querySelector(s),list=$('#list'),sheet=$('#sheet'),scrim=$('#scrim');
let ani=true;
function render(){const q=$('#q').value.toLowerCase();list.innerHTML='';
const r=apps.filter(a=>(a.n+a.b).toLowerCase().includes(q));
const an=ani;ani=false;r.forEach((a,i)=>{const d=document.createElement('div');d.className='row'+(an||a.fresh?' in':'');delete a.fresh;d.style.setProperty('--i',i);d.tabIndex=0;
d.innerHTML=(IMG[a.i]?'<img class="icon" alt="" src="'+IMG[a.i]+'">':GEN)+'<div class="txt"><div class="name"></div><div class="sub"></div></div>';
d.querySelector('.name').textContent=a.n;d.querySelector('.sub').textContent=a.v+' • '+a.b;
d.onclick=()=>menu(a.n,[['Open',()=>note(a.n,'Opening…')],['Show Details',()=>note(a.n,'Version '+a.v+'\n'+a.b)],['Uninstall App',()=>{d.classList.add('gone');setTimeout(()=>{apps=apps.filter(x=>x!==a);render()},380)},'d']]);list.appendChild(d)});
if(!r.length)list.innerHTML='<div class="empty">'+(apps.length?'No results':'No apps installed')+'</div>'}
function menu(t,items){sheet.innerHTML='';const g=document.createElement('div');g.className='sg';
if(t){const h=document.createElement('div');h.className='st';h.textContent=t;g.appendChild(h)}
items.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=()=>{close();f&&setTimeout(f,250)};g.appendChild(b)});
const c=document.createElement('div');c.className='sg';c.innerHTML='<button class="c">Cancel</button>';c.firstChild.onclick=close;
sheet.append(g,c);sheet.classList.add('on');scrim.classList.add('on')}
function close(){sheet.classList.remove('on');scrim.classList.remove('on')}
scrim.onclick=()=>{close();popClose()};
let at;function note(t,p){$('#at').textContent=t;$('#ap').textContent=p;$('.bar').style.display='none';$('#alert').classList.add('on');clearTimeout(at);at=setTimeout(()=>$('#alert').classList.remove('on'),2200)}
function prog(t,done){$('#at').textContent=t;$('#ap').textContent='Please wait';$('.bar').style.display='block';const i=$('.bar i');i.style.width='0';$('#alert').classList.add('on');let p=0;
const iv=setInterval(()=>{p+=8+Math.random()*16;i.style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(iv);setTimeout(()=>{$('#alert').classList.remove('on');done&&done()},250)}},160)}
function fake(name){const n=name.replace(/\.ipa$/i,'')||'App';prog('Installing '+n,()=>{apps.push({fresh:1,n,v:'1.0',b:'com.demo.'+n.toLowerCase().replace(/[^a-z0-9]/g,''),i:'gen'});$('#q').value='';render()})}
const pop=$('#pop');
function popClose(){pop.classList.remove('on');scrim.classList.remove('on')}
$('#plus').onclick=()=>{const r=$('#plus').getBoundingClientRect();pop.style.top=(r.bottom+8)+'px';pop.style.right=Math.max(12,innerWidth-r.right)+'px';pop.classList.add('on');scrim.classList.add('on')};
$('#p1').onclick=()=>{popClose();$('#file').click()};
$('#p2').onclick=()=>{popClose();setTimeout(()=>{const u=prompt('Enter .ipa URL');if(u)fake(u.split('/').pop().split('?')[0])},200)};
$('#file').onchange=e=>{const f=e.target.files[0];if(f)fake(f.name);e.target.value=''};
$('#q').oninput=render;
addEventListener('keydown',e=>{if(e.key==='Escape'){close();popClose()}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t.dataset.v));document.documentElement.dataset.v=t.dataset.v;scrollTo(0,0)});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>prog(b.dataset.a,()=>note('Done','')));
$('#conf').onclick=()=>{const o=['Always','Never','Ask'];const c=$('#cv');c.textContent=o[(o.indexOf(c.textContent)+1)%3]};
$('#sw').onclick=e=>e.target.setAttribute('aria-checked',e.target.getAttribute('aria-checked')!=='true');
addEventListener('scroll',()=>document.documentElement.classList.toggle('scrolled',scrollY>2),{passive:true});
document.documentElement.dataset.v='apps';
render();

const tick=()=>{try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
const tabsEl=document.querySelector('.tabs>div'),lens=document.querySelector('.lens');
function placeLens(){const t=document.querySelector('.tab[aria-selected=true]');if(!t)return;lens.style.width=t.offsetWidth+'px';lens.style.transform='translateX('+(t.offsetLeft-5)+'px)'}
function stagger(){document.querySelectorAll('#v-settings>.hd,#v-settings>.grp,#v-settings>.ft').forEach((e,i)=>e.style.setProperty('--i',i))}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{placeLens();tick();stagger();if(t.dataset.v==='apps'){ani=true;render()}}));
let down=false;
let pt;
tabsEl.addEventListener('pointerdown',()=>{down=true;clearTimeout(pt);tabsEl.classList.add('press')});
const up=()=>{down=false;clearTimeout(pt);pt=setTimeout(()=>tabsEl.classList.remove('press'),220)};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
tabsEl.addEventListener('pointermove',e=>{if(!down)return;const t=document.elementFromPoint(e.clientX,e.clientY);const b=t&&t.closest&&t.closest('.tab');if(b&&b.getAttribute('aria-selected')!=='true')b.click()});
addEventListener('resize',placeLens);addEventListener('load',placeLens);
requestAnimationFrame(placeLens);
const sb=$('#sb'),qi=$('#q');
qi.addEventListener('focus',()=>sb.classList.add('f'));
qi.addEventListener('blur',()=>{if(!qi.value)sb.classList.remove('f')});
$('#cancel').addEventListener('click',()=>{qi.value='';qi.blur();sb.classList.remove('f');render()});
$('#plus').addEventListener('click',tick);
stagger();
</script></body></html>
